[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytodo"
version = "0.1.0"
description = "A command-line todo list manager"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "typer",
    "rich",
]

[project.scripts]
todo = "pytodo.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["pytodo*"]
